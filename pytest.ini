[pytest]
testpaths = tests
pythonpath = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    splash: Splash page tests
    onboarding: Onboarding page tests
    auth: Authentication page tests
    home: Home page tests
    scan: Scan page tests
    result: Result page tests
    history: History page tests
    fraudmap: Fraud map page tests
    settings: Settings page tests
    navigation: Navigation and layout tests
    vulnerability: Security and vulnerability tests
    responsive: Responsive design tests
