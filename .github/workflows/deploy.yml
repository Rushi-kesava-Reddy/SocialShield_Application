# ─── GitHub Actions: Build, Deploy & E2E Test ──────────────────────────────────
# Runs on every push to main — builds/deploys the app and runs sequential E2E tests.

name: 🚀 Build, Deploy & Test

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Allow only one run at a time
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  SITE_URL: "https://rushi-kesava-reddy.github.io/SocialShield_Application/"
  PYTHON_VERSION: "3.11"

jobs:
  build:
    name: 🏗️ Build Vite App
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🔨 Build
        run: npm run build
        env:
          VITE_API_URL: "https://socialshield-backend.onrender.com"

      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    name: 🌐 Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  e2e-tests:
    name: 🧪 Run Selenium E2E Tests
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Python ──
      - name: 🐍 Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: tests/requirements.txt

      # ── 3. Install Chrome ──
      - name: 🌐 Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # ── 4. Install ChromeDriver ──
      - name: 🔧 Setup ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      # ── 5. Install Python dependencies ──
      - name: 📦 Install test dependencies
        run: |
          pip install --upgrade pip
          pip install -r tests/requirements.txt

      # ── 6. Create test results directory ──
      - name: 📁 Create results directory
        run: mkdir -p test-results/screenshots

      # ── 7. Run Selenium E2E Tests ──
      - name: 🧪 Run E2E Tests
        env:
          SITE_URL: ${{ env.SITE_URL }}
          DISPLAY: ":99"
        run: |
          # Start virtual display for Chrome
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb > /dev/null 2>&1
          Xvfb :99 -screen 0 1920x1080x24 &

          # Run tests (continue even if some fail so we get the full report)
          pytest tests/ \
            --junitxml=test-results/results.xml \
            -v \
            --tb=short \
            || true

      # ── 8. Generate .xlsx Report ──
      - name: 📊 Generate Excel Report
        if: always()
        run: python tests/generate_report.py

      # ── 9. Upload Test Report (.xlsx) ──
      - name: 📤 Upload E2E Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: E2E-Test-Report-SocialShield
          path: test-results/E2E_Test_Report_SocialShield_*.xlsx
          retention-days: 30
          if-no-files-found: warn

      # ── 10. Upload Screenshots (on failure) ──
      - name: 📸 Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: E2E-Failure-Screenshots
          path: test-results/screenshots/
          retention-days: 7
          if-no-files-found: ignore

      # ── 11. Upload JUnit XML ──
      - name: 📄 Upload JUnit XML Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JUnit-XML-Results
          path: test-results/results.xml
          retention-days: 30
          if-no-files-found: warn

      # ── 12. Print Test Summary ──
      - name: 📋 Print Test Summary
        if: always()
        run: |
          echo "═══════════════════════════════════════════════════"
          echo "  🛡️ SOCIALSHIELD E2E TEST RESULTS"
          echo "═══════════════════════════════════════════════════"
          if [ -f test-results/results.xml ]; then
            TOTAL=$(grep -c '<testcase' test-results/results.xml || echo "0")
            FAILURES=$(grep -c '<failure' test-results/results.xml || echo "0")
            ERRORS=$(grep -c '<error' test-results/results.xml || echo "0")
            SKIPPED=$(grep -c '<skipped' test-results/results.xml || echo "0")
            PASSED=$((TOTAL - FAILURES - ERRORS - SKIPPED))
            echo "  Total:    $TOTAL"
            echo "  Passed:   $PASSED ✅"
            echo "  Failed:   $((FAILURES + ERRORS)) ❌"
            echo "  Skipped:  $SKIPPED ⏭️"
            if [ $TOTAL -gt 0 ]; then
              RATE=$(( PASSED * 100 / TOTAL ))
              echo "  Pass Rate: ${RATE}%"
            fi
          else
            echo "  ⚠️ No results XML found"
          fi
          echo "═══════════════════════════════════════════════════"
          echo ""
          echo "📥 Download the .xlsx report from the 'Artifacts' section above."
